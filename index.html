<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霓虹轮廓描边工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e14;
    --panel: #171722;
    --border: #2a2a3a;
    --accent: #00e5ff;
    --text: #e8e8f0;
    --muted: #9a9ab0;
    --ok: #2bd48a;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 20% -10%, #1b1b2e 0%, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 18px 22px 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(20,20,30,.7);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 20;
  }
  .wrap { max-width: 1240px; margin: 0 auto; }
  .head-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #7c4dff);
    display: grid; place-items: center; flex: none;
    box-shadow: 0 0 18px rgba(0,229,255,.5);
  }
  .logo svg { width: 20px; height: 20px; }
  h1 { font-size: 19px; font-weight: 700; letter-spacing: .3px; }
  .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 18px; padding: 20px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  /* 控制面板 */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; align-self: start; }
  .panel h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; margin-bottom: 6px; }
  .field .row { display: flex; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 14px; border: none; border-radius: 9px; cursor: pointer;
    font-size: 13.5px; font-weight: 600; transition: .15s; width: 100%;
  }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #7c4dff); color: #06121a; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-ghost { background: #232335; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: #2d2d42; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }
  .drop {
    border: 1.5px dashed var(--border); border-radius: 12px; padding: 22px 14px;
    text-align: center; color: var(--muted); font-size: 13px; cursor: pointer;
    transition: .2s; margin-bottom: 14px;
  }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--text); background: rgba(0,229,255,.05); }
  .drop .big { font-size: 26px; display: block; margin-bottom: 6px; }
  input[type="file"] { display: none; }
  select, input[type="range"] { width: 100%; }
  select {
    background: #232335; color: var(--text); border: 1px solid var(--border);
    padding: 8px 10px; border-radius: 8px; font-size: 13.5px;
  }
  .swatches { display: flex; gap: 8px; }
  .swatch {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: .15s;
  }
  .swatch.active { border-color: #fff; box-shadow: 0 0 10px currentColor; }
  .slider-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  input[type="range"] { accent-color: var(--accent); }
  .mode-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .mode-tab {
    flex: 1; padding: 8px; text-align: center; border-radius: 8px; cursor: pointer;
    font-size: 12.5px; background: #232335; color: var(--muted); border: 1px solid transparent;
  }
  .mode-tab.active { background: rgba(0,229,255,.12); color: var(--accent); border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
  .status {
    padding: 9px 12px; border-radius: 9px; font-size: 12.5px; margin-top: 12px; display: none;
    background: #232335; border: 1px solid var(--border);
  }
  .status.show { display: block; }
  .status.ok { border-color: var(--ok); color: var(--ok); }
  .status.err { border-color: #ff5d5d; color: #ff8080; }

  /* 画布区 */
  .stage {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; min-height: 500px;
    display: flex; flex-direction: column;
  }
  .stage-toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .stage-toolbar .spacer { flex: 1; }
  .canvas-shell { position: relative; flex: 1; display: grid; place-items: center; overflow: auto; min-height: 420px; background: repeating-conic-gradient(#1a1a26 0 25%, #181824 0 50%) 0 0 / 24px 24px; border-radius: 10px; }
  canvas { max-width: 100%; max-height: 78vh; display: block; border-radius: 4px; box-shadow: 0 6px 30px rgba(0,0,0,.4); }
  .empty { position: absolute; color: var(--muted); text-align: center; font-size: 14px; line-height: 1.8; }
  .empty .big { font-size: 40px; display: block; margin-bottom: 8px; }
  .coords { font-size: 11.5px; color: var(--muted); margin-top: 10px; min-height: 16px; }
  footer { text-align: center; color: #5f5f77; font-size: 12px; padding: 16px 20px 30px; }
  footer a { color: #7f7f9b; }
  @media (max-width: 640px) {
    .field label, .hint, .sub { font-size: 14px; }
    select { font-size: 16px; }
    .drop { font-size: 14px; }
    .btn { font-size: 15px; }
    .mode-tab { font-size: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap head-row">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 3l1.9 5.6L19 9l-4.4 3.4L16 18l-4-2.6L8 18l1.4-5.6L5 9l5.1-.4z"/></svg>
    </div>
    <div>
      <h1>霓虹轮廓描边工具</h1>
      <div class="sub">上传图片 → 框选目标 → 自动沿轮廓添加霓虹发光线条</div>
    </div>
  </div>
</header>

<div class="wrap layout">

  <!-- ===== 控制面板 ===== -->
  <aside class="panel">
    <h2>① 上传图片</h2>
    <div class="drop" id="dropZone">
      <span class="big">📁</span>
      点击或拖拽图片到此处<br><span style="font-size:11px">JPG / PNG / WebP</span>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <h2>② 框选方式</h2>
    <div class="mode-tabs">
      <div class="mode-tab active" data-mode="edge" id="modeEdge">沿轮廓描边</div>
      <div class="mode-tab" data-mode="rect" id="modeRect">矩形描边</div>
    </div>

    <h2>③ 霓虹样式</h2>
    <div class="field">
      <label>颜色</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="field">
      <div class="slider-label"><span>线条粗细</span><span id="wVal">3px</span></div>
      <input type="range" id="lineWidth" min="1" max="10" step="0.5" value="3">
    </div>
    <div class="field">
      <div class="slider-label"><span>光晕强度</span><span id="bVal">18</span></div>
      <input type="range" id="glowBlur" min="4" max="40" step="1" value="18">
    </div>
    <div class="field" id="threshField">
      <div class="slider-label"><span>轮廓敏感度</span><span id="tVal">45</span></div>
      <input type="range" id="threshold" min="10" max="120" step="1" value="45">
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="applyBtn">✨ 生成霓虹</button>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-ghost" id="undoBtn">撤销</button>
      <button class="btn btn-ghost" id="resetBtn">重置</button>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-ghost" id="downloadBtn">⬇ 下载图片</button>
    </div>
    <div class="status" id="status"></div>
    <p class="hint">提示：拖动鼠标在图片上框选目标区域，点击「生成霓虹」后，工具会自动检测该区域内的物体轮廓并沿轮廓添加霓虹发光线条。</p>
  </aside>

  <!-- ===== 画布区 ===== -->
  <section class="stage">
    <div class="stage-toolbar">
      <span style="font-size:12.5px;color:var(--muted)">预览</span>
      <div class="spacer"></div>
      <span class="coords" id="coords"></span>
    </div>
    <div class="canvas-shell" id="shell">
      <div class="empty" id="emptyState">
        <span class="big">🖼️</span>
        上传一张图片开始<br>之后用鼠标拖拽框选要描边的物体
      </div>
      <canvas id="mainCanvas"></canvas>
    </div>
  </section>
</div>

<footer>纯前端本地处理 · 图片不会上传到服务器 · 完全开源</footer>

<script>
(function(){
  "use strict";

  // ---------- 基础状态 ----------
  var canvas = document.getElementById("mainCanvas");
  var ctx = canvas.getContext("2d", { willReadFrequently: true });
  var shell = document.getElementById("shell");
  var emptyState = document.getElementById("emptyState");
  var coordsEl = document.getElementById("coords");

  var img = null;          // 原始图片 Image
  var imgW = 0, imgH = 0;
  var originalData = null; // 原始像素（用于撤销/重置）
  var selection = null;    // {x,y,w,h} 屏幕坐标（相对画布CSS像素）
  var hasNeon = false;

  var mode = "edge";
  var isDragging = false;
  var startPt = null;

  var currentColor = "#00e5ff";

  var COLORS = ["#00e5ff","#ff4dd2","#ffd23d","#7c4dff","#2bd48a","#ff6b6b"];
  var swatchesEl = document.getElementById("swatches");
  COLORS.forEach(function(c){
    var s = document.createElement("div");
    s.className = "swatch" + (c === currentColor ? " active" : "");
    s.style.background = c;
    s.dataset.color = c;
    s.onclick = function(){ currentColor = c; updateSwatches(); };
    swatchesEl.appendChild(s);
  });
  function updateSwatches(){
    var all = swatchesEl.querySelectorAll(".swatch");
    all.forEach(function(s){ s.classList.toggle("active", s.dataset.color === currentColor); });
  }

  // ---------- 参数控件 ----------
  var lineWidthEl = document.getElementById("lineWidth");
  var glowBlurEl  = document.getElementById("glowBlur");
  var thresholdEl = document.getElementById("threshold");
  var wVal = document.getElementById("wVal");
  var bVal = document.getElementById("bVal");
  var tVal = document.getElementById("tVal");
  lineWidthEl.oninput = function(){ wVal.textContent = this.value + "px"; };
  glowBlurEl.oninput  = function(){ bVal.textContent = this.value; };
  thresholdEl.oninput = function(){ tVal.textContent = this.value; };

  // ---------- 模式切换 ----------
  document.getElementById("modeEdge").onclick = function(){ setMode("edge"); };
  document.getElementById("modeRect").onclick = function(){ setMode("rect"); };
  function setMode(m){
    mode = m;
    document.getElementById("modeEdge").classList.toggle("active", m === "edge");
    document.getElementById("modeRect").classList.toggle("active", m === "rect");
    document.getElementById("threshField").style.display = m === "edge" ? "block" : "none";
    redraw();
  }

  // ---------- 状态提示 ----------
  var statusEl = document.getElementById("status");
  var statusTimer = null;
  function showStatus(msg, type){
    statusEl.textContent = msg;
    statusEl.className = "status show" + (type ? " " + type : "");
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function(){ statusEl.classList.remove("show"); }, 3200);
  }

  // ---------- 图片加载 ----------
  var fileInput = document.getElementById("fileInput");
  var dropZone = document.getElementById("dropZone");
  fileInput.onchange = function(e){ if(e.target.files[0]) loadFile(e.target.files[0]); };
  dropZone.onclick = function(){ fileInput.click(); };
  ["dragover","dragenter"].forEach(function(ev){
    dropZone.addEventListener(ev, function(e){ e.preventDefault(); dropZone.classList.add("over"); });
  });
  ["dragleave","drop"].forEach(function(ev){
    dropZone.addEventListener(ev, function(e){ e.preventDefault(); dropZone.classList.remove("over"); });
  });
  dropZone.addEventListener("drop", function(e){
    if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  function loadFile(file){
    if(!file.type.match(/^image\//)){ showStatus("请选择图片文件", "err"); return; }
    var reader = new FileReader();
    reader.onload = function(ev){
      var image = new Image();
      image.onload = function(){ setupImage(image); };
      image.onerror = function(){ showStatus("图片加载失败", "err"); };
      image.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function setupImage(image){
    img = image;
    imgW = image.naturalWidth;
    imgH = image.naturalHeight;
    canvas.width = imgW;
    canvas.height = imgH;
    canvas.style.width = "auto";
    canvas.style.height = "auto";
    emptyState.style.display = "none";
    ctx.drawImage(img, 0, 0);
    originalData = ctx.getImageData(0, 0, imgW, imgH);
    selection = null;
    hasNeon = false;
    showStatus("图片已加载，拖动框选目标区域", "ok");
  }

  // ---------- 重绘 ----------
  function redraw(){
    if(!img) return;
    ctx.clearRect(0,0,imgW,imgH);
    ctx.drawImage(img, 0, 0);
    if(selection) drawSelection();
  }

  function drawSelection(){
    var s = selection;
    ctx.save();
    // 半透明蒙版
    ctx.fillStyle = "rgba(0,229,255,0.08)";
    ctx.fillRect(s.x, s.y, s.w, s.h);
    // 边框
    ctx.strokeStyle = "#00e5ff";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6,4]);
    ctx.strokeRect(s.x, s.y, s.w, s.h);
    // 角点
    ctx.setLineDash([]);
    ctx.fillStyle = "#00e5ff";
    var corners = [[s.x,s.y],[s.x+s.w,s.y],[s.x,s.y+s.h],[s.x+s.w,s.y+s.h]];
    corners.forEach(function(p){
      ctx.beginPath(); ctx.arc(p[0], p[1], 4, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  // ---------- 鼠标框选 ----------
  function canvasPos(e){
    var r = canvas.getBoundingClientRect();
    var sx = (e.clientX - r.left) * (imgW / r.width);
    var sy = (e.clientY - r.top) * (imgH / r.height);
    return { x: Math.max(0, Math.min(imgW, sx)), y: Math.max(0, Math.min(imgH, sy)) };
  }
  canvas.addEventListener("mousedown", function(e){
    if(!img) return;
    isDragging = true;
    startPt = canvasPos(e);
    coordsEl.textContent = "起点 (" + Math.round(startPt.x) + ", " + Math.round(startPt.y) + ")";
  });
  canvas.addEventListener("mousemove", function(e){
    if(!img) return;
    var p = canvasPos(e);
    coordsEl.textContent = isDragging
      ? "起点 (" + Math.round(startPt.x) + ", " + Math.round(startPt.y) + ") → 当前 (" + Math.round(p.x) + ", " + Math.round(p.y) + ")"
      : "坐标 (" + Math.round(p.x) + ", " + Math.round(p.y) + ")";
    if(!isDragging || !startPt) return;
    var x = Math.min(startPt.x, p.x), y = Math.min(startPt.y, p.y);
    var w = Math.abs(p.x - startPt.x), h = Math.abs(p.y - startPt.y);
    if(w < 3 || h < 3) return;
    selection = { x: x, y: y, w: w, h: h };
    redraw();
  });
  var endDrag = function(){
    if(isDragging && selection){
      coordsEl.textContent = "已框选 " + Math.round(selection.w) + "×" + Math.round(selection.h) + " 像素区域";
    }
    isDragging = false;
    startPt = null;
  };
  canvas.addEventListener("mouseup", endDrag);
  canvas.addEventListener("mouseleave", endDrag);

  // 触屏支持
  canvas.addEventListener("touchstart", function(e){
    e.preventDefault();
    if(!img) return;
    var t = e.touches[0];
    var ev = { clientX: t.clientX, clientY: t.clientY };
    isDragging = true; startPt = canvasPos(ev);
  }, { passive: false });
  canvas.addEventListener("touchmove", function(e){
    e.preventDefault();
    if(!img || !isDragging) return;
    var t = e.touches[0];
    var ev = { clientX: t.clientX, clientY: t.clientY };
    var p = canvasPos(ev);
    var x = Math.min(startPt.x, p.x), y = Math.min(startPt.y, p.y);
    var w = Math.abs(p.x - startPt.x), h = Math.abs(p.y - startPt.y);
    if(w >= 3 && h >= 3){ selection = {x:x,y:y,w:w,h:h}; redraw(); }
  }, { passive: false });
  canvas.addEventListener("touchend", endDrag);

  // ---------- 边缘检测 (Sobel) ----------
  function sobelEdges(data, x0, y0, w, h, threshold){
    // 返回边缘强度数组 (w*h)
    var gw = new Float32Array(w*h);
    var i = 0;
    for(var y = 0; y < h; y++){
      for(var x = 0; x < w; x++){
        var gx = 0, gy = 0;
        for(var ky = -1; ky <= 1; ky++){
          for(var kx = -1; kx <= 1; kx++){
            var px = x + kx, py = y + ky;
            if(px < 0 || px >= w || py < 0 || py >= h){ continue; }
            // 注意：getImageData(x0,y0,w,h) 返回的 data 是选区局部坐标，索引用 (py*w+px)*4
            var idx = (py * w + px) * 4;
            var gray = 0.299*data[idx] + 0.587*data[idx+1] + 0.114*data[idx+2];
            gx += gray * (kx === 0 ? 0 : (kx * (ky === 0 ? 2 : 1)));
            gy += gray * (ky === 0 ? 0 : (ky * (kx === 0 ? 2 : 1)));
          }
        }
        var mag = Math.sqrt(gx*gx + gy*gy);
        gw[i++] = mag;
      }
    }
    // 自适应阈值：保留显著强边缘（灵敏度由 slider 与最大梯度共同决定）
    var magMax = 0;
    for(var j = 0; j < w*h; j++) if(gw[j] > magMax) magMax = gw[j];
    var threshVal = Math.max(threshold * 0.5, magMax * 0.12);
    for(var j2 = 0; j2 < w*h; j2++) gw[j2] = gw[j2] > threshVal ? gw[j2] : 0;
    return gw;
  }

  function drawNeonOnEdges(edgeArr, w, h){
    var lineW = parseFloat(lineWidthEl.value);
    var blur = parseFloat(glowBlurEl.value);
    ctx.save();
    ctx.strokeStyle = currentColor;
    ctx.fillStyle = currentColor;
    ctx.lineWidth = lineW;
    ctx.shadowColor = currentColor;
    ctx.shadowBlur = blur;
    // 分两次：外发光 + 亮芯
    ctx.globalAlpha = 0.85;
    for(var pass = 0; pass < 2; pass++){
      ctx.shadowBlur = pass === 0 ? blur : blur * 0.5;
      for(var y = 0; y < h; y++){
        for(var x = 0; x < w; x++){
          if(edgeArr[y*w + x] > 0){
            var px = Math.round(selection.x) + x, py = Math.round(selection.y) + y;
            ctx.beginPath();
            ctx.arc(px, py, pass === 0 ? lineW : Math.max(0.6, lineW*0.45), 0, Math.PI*2);
            ctx.fill();
          }
        }
      }
    }
    ctx.restore();
  }

  function drawRectNeon(){
    var s = selection;
    var lineW = parseFloat(lineWidthEl.value);
    var blur = parseFloat(glowBlurEl.value);
    ctx.save();
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = lineW;
    ctx.shadowColor = currentColor;
    ctx.shadowBlur = blur;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.rect(s.x, s.y, s.w, s.h);
    ctx.stroke();
    ctx.restore();
  }

  // ---------- 生成霓虹 ----------
  document.getElementById("applyBtn").onclick = function(){
    if(!img){ showStatus("请先上传图片", "err"); return; }
    if(!selection){ showStatus("请先拖动框选目标区域", "err"); return; }

    // 恢复原始
    ctx.putImageData(originalData, 0, 0);

    if(mode === "rect"){
      drawRectNeon();
    } else {
      // 读取选区像素做边缘检测
      var s = selection;
      var x0 = Math.floor(s.x), y0 = Math.floor(s.y);
      var w = Math.max(2, Math.floor(s.w)), h = Math.max(2, Math.floor(s.h));
      if(x0 + w > imgW) w = imgW - x0;
      if(y0 + h > imgH) h = imgH - y0;
      if(w < 2 || h < 2){ showStatus("选区太小", "err"); return; }
      var regionData = ctx.getImageData(x0, y0, w, h);
      var thresh = parseInt(thresholdEl.value, 10);
      var edges = sobelEdges(regionData.data, x0, y0, w, h, thresh);
      drawNeonOnEdges(edges, w, h);
    }
    hasNeon = true;
    showStatus("已生成霓虹轮廓 ✨", "ok");
  };

  // ---------- 撤销 / 重置 ----------
  document.getElementById("undoBtn").onclick = function(){
    if(!img){ return; }
    ctx.putImageData(originalData, 0, 0);
    selection = null;
    hasNeon = false;
    coordsEl.textContent = "";
    showStatus("已撤销");
  };
  document.getElementById("resetBtn").onclick = function(){
    if(!img){ return; }
    ctx.putImageData(originalData, 0, 0);
    selection = null;
    hasNeon = false;
    coordsEl.textContent = "";
    showStatus("已重置");
  };

  // ---------- 下载 ----------
  document.getElementById("downloadBtn").onclick = function(){
    if(!img){ showStatus("请先上传图片", "err"); return; }
    var a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = "neon_outline_" + Date.now() + ".png";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showStatus("图片已下载", "ok");
  };

})();
</script>
</body>
</html>
